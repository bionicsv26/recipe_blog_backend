services:
  postgres:
    image: postgres:16.6
    container_name: recipe-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recipe-blog-net

  redis:
    image: redis:7.4-alpine
    container_name: recipe-blog-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recipe-blog-net
    
  redis-test:
    image: redis:7.4-alpine
    container_name: recipe-blog-redis-test
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [test]
    networks:
      - recipe-blog-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: recipe-blog-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: [test]
    networks:
      - recipe-blog-net

  rustfs:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    container_name: recipe-blog-rustfs
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recipe-blog-net

  s3-init:
    image: amazon/aws-cli@sha256:271de464e935f765aa2afb6ec69881e9f4a9afd3e978214a2b5f5ddcbbc161b5
    container_name: recipe_blog_s3_init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT_INTERNAL: http://rustfs:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_TEST_BUCKET_NAME: ${S3_TEST_BUCKET_NAME:-recipe-media-test}
    volumes:
      - ./docker/s3:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    networks:
      - recipe-blog-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rustfs_data:

networks:
  recipe-blog-net:
    driver: bridge