services:
  postgres:
    image: postgres:16.6
    container_name: recipe-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recipe-blog-net

  redis:
    image: redis:7.4-alpine
    container_name: recipe-blog-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recipe-blog-net
    
  redis-test:
    image: redis:7.4-alpine
    container_name: recipe-blog-redis-test
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [test]
    networks:
      - recipe-blog-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: recipe-blog-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: [test]
    networks:
      - recipe-blog-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: recipe-blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      # test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - recipe-blog-net
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: recipe_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - recipe-blog-net
    # [MEDIA-01] ILM-правило на temp/ намеренно НЕ создаётся.
    # На объекты в temp/ есть живые ссылки в БД (обложки рецептов, фото шагов
    # и отзывов): moveToPermanent для них не вызывается. Хранилище не знает
    # о БД, поэтому ретенция на уровне ILM уничтожала используемые файлы.
    # Ретенция сирот — только на стороне приложения (MediaCleanupService).
    entrypoint: >
      /bin/sh -c "
      echo 'Подключение к MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};

      echo 'Создание бакета ${S3_BUCKET_NAME}...';
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_NAME};

      echo 'Создание тестового бакета...';
      /usr/bin/mc mb --ignore-existing myminio/${S3_TEST_BUCKET_NAME:-recipe-media-test};
      /usr/bin/mc anonymous set download myminio/${S3_TEST_BUCKET_NAME:-recipe-media-test};

      echo 'Установка публичной политики чтения (download)...';
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME};

      echo 'Снятие ILM-правил (ретенция только на стороне приложения)...';
      /usr/bin/mc ilm rule remove --all --force myminio/${S3_BUCKET_NAME} || true;

      echo 'Список активных правил Lifecycle (ожидается пусто):';
      /usr/bin/mc ilm rule list myminio/${S3_BUCKET_NAME};

      echo '(сообщение об отсутствии lifecycle-конфигурации = правил нет, это ожидаемо)';

      echo 'Инициализация MinIO завершена.';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  recipe-blog-net:
    driver: bridge