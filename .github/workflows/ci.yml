name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Значения ОБЯЗАНЫ совпадать с test/.env.test:
      # compose поднимает контейнеры с этими кредами, тесты ходят в них же.
      # POSTGRES_DB здесь — основная БД, тестовую создаёт init-скрипт.
      - name: Prepare .env for docker compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=root
          POSTGRES_PASSWORD=12345678
          POSTGRES_DB=recipe-blog
          POSTGRES_PORT=5434
          REDIS_PASSWORD=87654321
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          S3_BUCKET_NAME=recipe-media
          S3_TEST_BUCKET_NAME=recipe-media-test
          EOF

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Start dependencies
        run: |
          docker compose --profile test up -d --wait postgres redis redis-test minio
          docker compose --profile test up -d mailhog
          docker compose --profile test run --rm minio-init

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Mail templates shipped to dist
        run: |
          test -f dist/mail/templates/welcome.hbs
          test -f dist/mail/templates/reset-password.hbs

      - name: Docker logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color